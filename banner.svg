<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="50%"  stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)" rx="16"/>

  <!-- Glow effect -->
  <ellipse cx="600" cy="140" rx="500" ry="80" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="70"  x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="900" y1="0" x2="900" y2="280"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(90, 60)">
    <path d="M60 0 L120 25 L120 90 Q120 140 60 160 Q0 140 0 90 L0 25 Z"
          fill="url(#accent)" opacity="0.15"/>
    <path d="M60 0 L120 25 L120 90 Q120 140 60 160 Q0 140 0 90 L0 25 Z"
          fill="none" stroke="url(#accent)" stroke-width="3"/>
    <!-- Check mark inside shield -->
    <polyline points="30,85 52,107 90,65"
              fill="none" stroke="#3b82f6" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="250" y="120" font-size="64" font-weight="800" fill="white" letter-spacing="-2">
    Deep<tspan fill="url(#accent)">Shield</tspan>
  </text>

  <!-- Accent bar -->
  <rect x="250" y="135" width="700" height="3" rx="2" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="252" y="175" font-size="20" fill="#94a3b8" letter-spacing="1">
    MULTIMODAL DEEPFAKE CLASSIFICATION ENGINE
  </text>

  <!-- Tags -->
  <g transform="translate(252, 200)">
    <!-- ViT tag -->
    <rect width="110" height="28" rx="6" fill="#1e3a5f"/>
    <text x="55" y="19" text-anchor="middle" font-size="12" fill="#60a5fa" font-weight="600">
      Vision Transformer
    </text>
    <!-- Wav2Vec2 tag -->
    <rect x="120" width="90" height="28" rx="6" fill="#1e3a5f"/>
    <text x="165" y="19" text-anchor="middle" font-size="12" fill="#60a5fa" font-weight="600">
      Wav2Vec2
    </text>
    <!-- DeBERTa tag -->
    <rect x="220" width="86" height="28" rx="6" fill="#1e3a5f"/>
    <text x="263" y="19" text-anchor="middle" font-size="12" fill="#60a5fa" font-weight="600">
      DeBERTa-v3
    </text>
    <!-- FastAPI tag -->
    <rect x="316" width="72" height="28" rx="6" fill="#1e3a5f"/>
    <text x="352" y="19" text-anchor="middle" font-size="12" fill="#60a5fa" font-weight="600">
      FastAPI
    </text>
    <!-- MIT tag -->
    <rect x="398" width="60" height="28" rx="6" fill="#14532d"/>
    <text x="428" y="19" text-anchor="middle" font-size="12" fill="#4ade80" font-weight="600">
      MIT
    </text>
  </g>

  <!-- Right side: accuracy badges -->
  <g transform="translate(940, 60)">
    <text x="120" y="20" text-anchor="middle" font-size="13" fill="#64748b">ACCURACY</text>

    <!-- Image -->
    <rect y="30" width="240" height="40" rx="8" fill="#0f2744"/>
    <text x="12" y="56" font-size="13" fill="#94a3b8">🖼️  Image Detection</text>
    <text x="228" y="56" text-anchor="end" font-size="16" fill="#3b82f6" font-weight="700">99.2%</text>

    <!-- Video -->
    <rect y="78" width="240" height="40" rx="8" fill="#0f2744"/>
    <text x="12" y="104" font-size="13" fill="#94a3b8">🎬  Video Detection</text>
    <text x="228" y="104" text-anchor="end" font-size="16" fill="#8b5cf6" font-weight="700">98.7%</text>

    <!-- Audio -->
    <rect y="126" width="240" height="40" rx="8" fill="#0f2744"/>
    <text x="12" y="152" font-size="13" fill="#94a3b8">🎙️  Audio Detection</text>
    <text x="228" y="152" text-anchor="end" font-size="16" fill="#06b6d4" font-weight="700">97.4%</text>

    <!-- Text -->
    <rect y="174" width="240" height="40" rx="8" fill="#0f2744"/>
    <text x="12" y="200" font-size="13" fill="#94a3b8">📰  Text Detection</text>
    <text x="228" y="200" text-anchor="end" font-size="16" fill="#10b981" font-weight="700">96.1%</text>
  </g>
</svg>
